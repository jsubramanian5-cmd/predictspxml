[build-system]
requires = ["setuptools==72.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spx-forecast"
version = "0.1.0"
description = "Auditable FRED/Cboe SPX settlement quantile forecasts"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.1.3", "pandas==2.2.3", "pyarrow==19.0.0",
  "scikit-learn==1.6.1", "xgboost==3.1.3", "matplotlib==3.10.0",
  "requests==2.32.3", "jupyterlab==4.3.4", "nbformat==5.10.4",
  "nbclient==0.10.2", "nbconvert==7.16.6", "ipykernel==6.29.5",
  "tzdata==2025.2", "lxml==5.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
